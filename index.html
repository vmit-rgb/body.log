<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- the bar colour follows the phone until the app puts its own theme on (ui/appearance.ts) -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#161616" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f7" />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="body.log" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>body.log</title>
    <style>
      /* screen/loading (Figma 347:9064): here, not in the stylesheets, so it shows before anything else loads */
      #loading { position: fixed; inset: 0; z-index: 2147482990; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--bg, #161616); color: var(--muted, #c4b1ba); font-family: 'Noto Sans Mono', ui-monospace, monospace; }
      #loading .ld { display: flex; gap: 2px; font-size: 30px; line-height: 1; font-weight: 600; color: rgb(var(--accent-rgb, 245 115 187) / 80%); }
      #loading .ld > span { display: block; width: 1ch; height: 1.5em; overflow: hidden; }
      /* the four frames | / - \ one above the other; a cell steps through them every 120 ms, each a step behind the one before */
      #loading .ld b { display: block; font-weight: inherit; line-height: 1.5em; white-space: pre; animation: ld-spin 480ms steps(4) infinite; }
      #loading .ld > span:nth-child(4n + 2) b { animation-delay: -360ms; }
      #loading .ld > span:nth-child(4n + 3) b { animation-delay: -240ms; }
      #loading .ld > span:nth-child(4n) b { animation-delay: -120ms; }
      #loading .ld-t { font-size: 12px; }
      @keyframes ld-spin { to { transform: translateY(-6em); } }
      @media (prefers-color-scheme: light) {
        /* until the app puts its theme on, follow the phone's */
        :root:not([data-theme]) #loading { background: #f6f5f7; color: #6e5e66; }
        :root:not([data-theme]) #loading .ld { color: rgb(169 44 119 / 80%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .ld b { animation: none; }
      }
      /* D-10: loading that never ended says so (the script at the end of the body) */
      #loading[data-stuck] { box-sizing: border-box; gap: 12px; padding: 24px; text-align: center; }
      #loading[data-stuck] p { margin: 0; width: 100%; max-width: 30ch; }
      #loading .ld-h { font-size: 16px; font-weight: 600; color: var(--ink, #e9e9e9); }
      #loading .ld-b { font-size: 14px; line-height: 1.5; }
      /* what broke the start, for a screenshot: small, selectable, long words wrap */
      #loading[data-stuck] .ld-e { max-width: 40ch; font-size: 12px; line-height: 1.5; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
      #loading button { min-height: 48px; margin-top: 12px; padding: 0 24px; border: 2px solid currentColor; border-radius: 0; background: none; color: var(--ink, #e9e9e9); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
      #loading button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) #loading :is(.ld-h, button) { color: #1a1a1a; }
      }
    </style>
  </head>

    <!-- «Політ символів»: the ASCII background (ui/flight.ts), decor only -->
    <canvas class="flight" aria-hidden="true"></canvas>
    <main id="app"></main>
    <div class="noise" aria-hidden="true"></div>
    <div class="noise noise--dark" aria-hidden="true"></div>
    <script>
      /*
       * D-10 (Olesia, 2026-11-15): no state lasts forever. When the app has not
       * taken the loading screen away in 7 s (the browser blocks its storage,
       * a file did not load, the script failed), the screen says so and offers
       * to load again. Here, not in the app's code: this must work exactly
       * when that code does not. If the app arrives later, it removes the layer as usual.
       */
      (function () {
        /*
         * What broke the start, shown on the stuck screen so a screenshot tells
         * the cause (2026-11-21: the iPhone got stuck while desktop WebKit didn't).
         * Script errors, files that did not load (capture: their error doesn't
         * bubble), refused promises and what the Content-Security-Policy blocked.
         */
        var errors = [];
        function note(text) {
          if (errors.length < 4) errors.push(String(text).slice(0, 300));
        }
        function where(file, line, col) {
          return file ? ' @ ' + String(file).split('/').pop() + ':' + line + ':' + col : '';
        }
        addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && (t.src || t.href)) note('not loaded: ' + (t.src || t.href).split('/').pop());
          else note((e.message || 'error') + where(e.filename, e.lineno, e.colno));
        }, true);
        addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          note('promise: ' + (r && (r.name ? r.name + ': ' : '') + (r && r.message || r)));
        });
        document.addEventListener('securitypolicyviolation', function (e) {
          note('csp: ' + e.effectiveDirective + ' ' + (e.blockedURI || '') + where(e.sourceFile, e.lineNumber, e.columnNumber));
        }, true);
        /* the loading screen in the app's language, before its code arrives (i18n/lang.ts: the link, the saved choice, then the phone) */
        var lang = new URLSearchParams(location.search).get('lang');
        try {
          if (lang !== 'en' && lang !== 'uk') lang = sessionStorage.getItem('phys-activity-tracking-app/lang') || localStorage.getItem('phys-activity-tracking-app/lang');
        } catch (e) {}
        if (lang !== 'en' && lang !== 'uk') {
          var phone = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().split(/[-_]/)[0];
          lang = !phone || phone === 'uk' || phone === 'ru' ? 'uk' : 'en';
        }
        if (lang === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.setAttribute('data-lang', 'en');
          var text = document.querySelector('#loading .ld-t');
          if (text) text.textContent = 'loading…';
        }
        setTimeout(function () {
          var layer = document.getElementById('loading');
          if (!layer || layer.hasAttribute('data-leaving')) return;
          layer.setAttribute('data-stuck', '');
          layer.setAttribute('role', 'alert');
          layer.innerHTML = document.documentElement.getAttribute('data-lang') === 'en'
            ? '<p class="ld-h">something went wrong: the app can\'t get its data &gt;_&lt;</p>'
              + '<p class="ld-b">reload the page. if it keeps happening, check that the browser doesn\'t block storing data for this site.</p>'
              + '<button type="button">reload</button>'
            : '<p class="ld-h">щось пішло не так: застосунок не може дочекатися даних &gt;_&lt;</p>'
              + '<p class="ld-b">онови сторінку. якщо повторюється — перевір, чи браузер не блокує збереження даних для цього сайту.</p>'
              + '<button type="button">оновити</button>';
          var details = document.createElement('p');
          details.className = 'ld-e';
          details.textContent = (errors.length ? errors.join('\n') : 'no error caught') + '\n' + navigator.userAgent;
          layer.appendChild(details);
          layer.querySelector('button').addEventListener('click', function () { location.reload(); });
        }, 7000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
