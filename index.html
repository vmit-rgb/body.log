    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <title>phys-activity-tracking-app</title>
    <style>
      /* screen/loading (Figma 347:9064): here, not in the stylesheets, so it shows before anything else loads */
      #loading { position: fixed; inset: 0; z-index: 2147482990; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: var(--bg, #161616); color: var(--muted, #c4b1ba); font-family: 'Noto Sans Mono', ui-monospace, monospace; }
      #loading .ld { display: flex; gap: 2px; font-size: 30px; line-height: 1; font-weight: 600; color: rgb(var(--accent-rgb, 245 115 187) / 80%); }
      #loading .ld > span { display: block; width: 1ch; height: 1.5em; overflow: hidden; }
      /* the four frames | / - \ one above the other; a cell steps through them every 120 ms, each a step behind the one before */
      #loading .ld b { display: block; font-weight: inherit; line-height: 1.5em; white-space: pre; animation: ld-spin 480ms steps(4) infinite; }
      #loading .ld > span:nth-child(4n + 2) b { animation-delay: -360ms; }
      #loading .ld > span:nth-child(4n + 3) b { animation-delay: -240ms; }
      #loading .ld > span:nth-child(4n) b { animation-delay: -120ms; }
      #loading .ld-t { font-size: 12px; }
      @keyframes ld-spin { to { transform: translateY(-6em); } }
      @media (prefers-color-scheme: light) {
        /* until the app puts its theme on, follow the phone's */
        :root:not([data-theme]) #loading { background: #f6f5f7; color: #6d5f63; }
        :root:not([data-theme]) #loading .ld { color: rgb(194 57 106 / 80%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading .ld b { animation: none; }
      }
      /* D-10: loading that never ended says so (the script at the end of the body) */
      #loading[data-stuck] { box-sizing: border-box; gap: 12px; padding: 24px; text-align: center; }
      #loading[data-stuck] p { margin: 0; width: 100%; max-width: 30ch; }
      #loading .ld-h { font-size: 16px; font-weight: 600; color: var(--ink, #e9e9e9); }
      #loading .ld-b { font-size: 14px; line-height: 1.5; }
      #loading button { min-height: 48px; margin-top: 12px; padding: 0 24px; border: 2px solid currentColor; border-radius: 0; background: none; color: var(--ink, #e9e9e9); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
      #loading button:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme]) #loading :is(.ld-h, button) { color: #1a1a1a; }
      }
    </style>
  </head>

    <main id="app"></main>
    <div class="noise" aria-hidden="true"></div>
    <div class="noise noise--dark" aria-hidden="true"></div>
    <script>
      /*
       * D-10 (Olesia, 2026-11-15): no state lasts forever. When the app has not
       * taken the loading screen away in 7 s (the browser blocks its storage,
       * a file did not load, the script failed), the screen says so and offers
       * to load again. Here, not in the app's code: this must work exactly
       * when that code does not. If the app arrives later, it removes the layer as usual.
       */
      (function () {
        setTimeout(function () {
          var layer = document.getElementById('loading');
          if (!layer || layer.hasAttribute('data-leaving')) return;
          layer.setAttribute('data-stuck', '');
          layer.setAttribute('role', 'alert');
          layer.innerHTML = '<p class="ld-h">щось пішло не так: застосунок не може дочекатися даних &gt;_&lt;</p>'
            + '<p class="ld-b">онови сторінку. якщо повторюється — перевір, чи браузер не блокує збереження даних для цього сайту.</p>'
            + '<button type="button">оновити</button>';
          layer.querySelector('button').addEventListener('click', function () { location.reload(); });
        }, 7000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
